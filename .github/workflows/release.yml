name: Release

# Pushing a vX.Y.Z tag publishes that version: a GitHub release with the zips, and
# the Kodi repository on GitHub Pages that installed copies update from.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches addon.xml and CHANGELOG.md
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('addon.xml').getroot().get('version'))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match addon.xml version $version."
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section."
            exit 1
          fi

  ci:
    needs: check-version
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The zip CI built and validated, so the release ships exactly what was checked.
      - uses: actions/download-artifact@v4
        with:
          name: addon-zip
          path: dist
      # The index page lists every release, newest first, including this one.
      - name: Build Kodi repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh release list --limit 100 --json tagName,publishedAt \
            --jq "[{tagName: \"$GITHUB_REF_NAME\", publishedAt: \"$now\"}] + ." > releases.json
          python3 scripts/build_repo.py --output site --releases releases.json dist/*.zip
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            /^## \[/ || /^\[/ { found = 0 }
            found
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip site/repository.modernrtpplay-*.zip \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
