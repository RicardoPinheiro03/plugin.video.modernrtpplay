name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - name: No compiled Python files committed
        run: |
          if git ls-files | grep -E '(^|/)__pycache__/|\.py[co]$'; then
            echo "::error::Remove the files above from git; .gitignore already ignores them."
            exit 1
          fi

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v --cov --cov-report=term-missing

  # Kodi 20 ships Python 3.8 on Windows and Android, and ruff's target-version
  # does not catch newer stdlib APIs, so run the suite on a real 3.8.
  test-py38:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip
          cache-dependency-path: requirements-py38.txt
      - run: pip install -r requirements-py38.txt
      - run: pytest -v

  build:
    needs: [lint, test, test-py38]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # The add-on manifest arrives in its own pull request; skip packaging until it exists.
      - name: Build add-on zip
        if: hashFiles('addon.xml') != ''
        run: python scripts/build_zip.py --output dist
      # Validate exactly what ships: the checker runs on the unpacked zip, against
      # the oldest supported Kodi (nexus, 20) and the current one (omega, 21).
      - name: Validate with kodi-addon-checker
        if: hashFiles('addon.xml') != ''
        run: |
          mkdir -p check
          unzip -q dist/*.zip -d check
          kodi-addon-checker --branch nexus check/*
          kodi-addon-checker --branch omega check/*
      - name: Upload zip
        if: hashFiles('addon.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: addon-zip
          path: dist/*.zip
          if-no-files-found: error
