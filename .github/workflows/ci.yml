name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs the same jobs before publishing.
  workflow_call:

permissions:
  contents: read

# Superseded pull request runs are cancelled. Every push to main gets its own group
# (keyed by commit), so queued main runs are never cancelled either. The workflow
# name keeps a release's CI run from queueing behind main's run of the same commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests that touch nothing in the add-on, its packaging or CI (docs, the
  # changelog) skip the full pipeline and only run `site`. Pushes to main, manual
  # runs and releases always run everything.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE"...HEAD)
          echo "$changed"
          pattern='^(resources/|main\.py$|addon\.xml$|repository\.modernrtpplay/|scripts/|tests/|pyproject\.toml$|requirements[^/]*\.txt$|\.github/workflows/)'
          if echo "$changed" | grep -qE "$pattern"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Builds the GitHub Pages site and checks it is what Kodi expects. Needs only the
  # standard library, so it runs on every change in seconds.
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_zip.py --output dist
      - run: python3 scripts/build_repo.py --output site dist/*.zip

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy
      - name: No compiled Python files committed
        run: |
          if git ls-files | grep -E '(^|/)__pycache__/|\.py[co]$'; then
            echo "::error::Remove the files above from git; .gitignore already ignores them."
            exit 1
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v --cov --cov-report=term-missing

  # Kodi 20 ships Python 3.8 on Windows and Android, and ruff's target-version
  # does not catch newer stdlib APIs, so run the suite on a real 3.8.
  test-py38:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip
          cache-dependency-path: requirements-py38.txt
      - run: pip install -r requirements-py38.txt
      - run: pytest -v

  build:
    needs: [lint, test, test-py38]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Build add-on zip
        run: python scripts/build_zip.py --output dist
      # Validate exactly what ships: the checker runs on the unpacked zip, against
      # the oldest supported Kodi (nexus, 20) and the current one (omega, 21).
      - name: Validate with kodi-addon-checker
        run: |
          mkdir -p check
          unzip -q dist/*.zip -d check
          kodi-addon-checker --branch nexus check/*
          kodi-addon-checker --branch omega check/*
      - name: Validate the repository add-on
        run: |
          python scripts/build_repo.py --output site dist/*.zip
          mkdir -p check-repo
          unzip -q site/repository.modernrtpplay-*.zip -d check-repo
          kodi-addon-checker --branch nexus check-repo/*
          kodi-addon-checker --branch omega check-repo/*
      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: addon-zip
          path: dist/*.zip
          if-no-files-found: error
