name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are cancelled; every push to main keeps its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  build:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # The add-on manifest arrives in its own pull request; skip packaging until it exists.
      - name: Build add-on zip
        if: hashFiles('addon.xml') != ''
        run: python scripts/build_zip.py --output dist
      # Validate exactly what ships: the checker runs on the unpacked zip.
      - name: Validate with kodi-addon-checker
        if: hashFiles('addon.xml') != ''
        run: |
          mkdir -p check
          unzip -q dist/*.zip -d check
          kodi-addon-checker --branch omega check/*
      - name: Upload zip
        if: hashFiles('addon.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: addon-zip
          path: dist/*.zip
          if-no-files-found: error
