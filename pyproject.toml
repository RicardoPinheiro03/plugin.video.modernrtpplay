# Tooling configuration only: the add-on itself is packaged by scripts/build_zip.py.

[tool.ruff]
line-length = 100
# Kodi 20 ships Python 3.8 on some platforms; keep the add-on code compatible.
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "C4", "ISC", "PIE", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["rtpplay", "plugin", "conftest", "build_zip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["resources/lib", "scripts"]

[tool.coverage.report]
fail_under = 90
exclude_also = ['if __name__ == "__main__":']
