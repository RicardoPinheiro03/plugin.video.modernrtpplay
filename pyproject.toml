# Tooling configuration only: the add-on itself is packaged by scripts/build_zip.py.

[tool.ruff]
line-length = 100
# Kodi 20 ships Python 3.8 on some platforms; keep the add-on code compatible.
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "C4", "ISC", "PIE", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["rtpplay", "plugin", "conftest", "build_zip", "build_repo"]

[tool.mypy]
# mypy cannot target 3.8; 3.8 itself is covered by ruff's target-version and test-py38.
python_version = "3.9"
files = ["scripts", "resources/lib"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Kodi's modules only exist inside Kodi.
module = ["xbmc", "xbmcaddon", "xbmcgui", "xbmcplugin", "xbmcvfs"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["resources/lib", "scripts"]

[tool.coverage.report]
fail_under = 90
exclude_also = ['if __name__ == "__main__":']
